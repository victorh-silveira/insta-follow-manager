minimum_pre_commit_version: "3.5.0"
fail_fast: true

default_language_version:
  python: python3.13

repos:
  - repo: local
    hooks:
      - id: commitlint-early
        name: Commitlint (Conventional Commits)
        entry: bash linters/git-hooks/bin/commitlint-early.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # --- Python ---
      - id: python-lint
        name: Python | Lint
        entry: python scripts/operations/clean_workspace.py --area python --stage lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: python-validate
        name: Python | Validate
        entry: python scripts/operations/clean_workspace.py --area python --stage validate
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: python-security
        name: Python | Seguranca
        entry: python scripts/operations/clean_workspace.py --area python --stage security
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: python-test
        name: Python | Testes
        entry: python scripts/operations/clean_workspace.py --area python --stage test --coverage-fail-under 80
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: python-build
        name: Python | Build
        entry: python scripts/operations/clean_workspace.py --area python --stage build
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # --- TypeScript ---
