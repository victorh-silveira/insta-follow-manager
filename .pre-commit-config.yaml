        name: Limpeza (caches e artefatos locais)
        entry: python scripts/operations/clean_workspace.py --area all --stage clean
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: commitlint
        name: Commitlint (Conventional Commits)
        entry: >-
          npx --yes -p @commitlint/cli -p @commitlint/config-conventional
          commitlint --config linters/commitlint.config.mjs --edit
        language: system
        stages: [commit-msg]
