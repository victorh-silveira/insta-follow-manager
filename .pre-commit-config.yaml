minimum_pre_commit_version: "3.5.0"
fail_fast: true

default_language_version:
  python: python3.13

repos:
  - repo: local
    hooks:
      - id: commitlint
        name: Commitlint | Conventional Commits
        entry: >-
          npx --yes -p @commitlint/cli -p @commitlint/config-conventional
          commitlint --config linters/commitlint.config.mjs --edit
        language: system
        stages: [commit-msg]

      - id: python-lint
        name: Python | Lint
        entry: python scripts/operations/clean_workspace.py --area python --stage lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: python-validate
        name: Python | Validate
        entry: python scripts/operations/clean_workspace.py --area python --stage validate
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: python-security
        name: Python | Seguranca
        entry: python scripts/operations/clean_workspace.py --area python --stage security
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: python-test
        name: Python | Testes
        entry: python scripts/operations/clean_workspace.py --area python --stage test --coverage-fail-under 80
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: python-build
        name: Python | Build
        entry: python scripts/operations/clean_workspace.py --area python --stage build
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: json-validate
        name: JSON | Validate
        entry: python scripts/operations/clean_workspace.py --area json --stage validate
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: yaml-lint
        name: YAML | Lint
        entry: python scripts/operations/clean_workspace.py --area yaml --stage lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: typescript-validate
        name: TypeScript | Validate
        entry: python scripts/operations/clean_workspace.py --area typescript --stage validate
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: react-lint
        name: React (ESLint) | Lint
        entry: python scripts/operations/clean_workspace.py --area react --stage lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: tailwind-validate
        name: Tailwind CSS | Validate
        entry: python scripts/operations/clean_workspace.py --area tailwind --stage validate
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: nextjs-build
        name: Next.js | Build
        entry: python scripts/operations/clean_workspace.py --area nextjs --stage build
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: docker-lint
        name: Docker | Lint
        entry: python scripts/operations/clean_workspace.py --area docker --stage lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: docker-validate
        name: Docker | Validate
        entry: python scripts/operations/clean_workspace.py --area docker --stage validate
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: shell-lint
        name: Shell | Lint
        entry: python scripts/operations/clean_workspace.py --area shell --stage lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
