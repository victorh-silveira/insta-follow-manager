name: insta-follow-manager

x-logging: &insta-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
      args:
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
        IMAGE_VERSION: ${IMAGE_VERSION:-dev}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        VCS_REF: ${VCS_REF:-unknown}
    container_name: insta-manager-backend
    restart: unless-stopped
    logging: *insta-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - path: ../../backend/.env
        required: false
    environment:
      INSTAGRAM_GATEWAY: ${INSTAGRAM_GATEWAY:-instagrapi}
      DATABASE_URL: sqlite:////app/data/insta_manager.db
      IG_SESSION_PATH: /app/data/session.json
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "${BIND_HOST:-0.0.0.0}:8000:8000"
    volumes:
      - insta_db_data:/app/data
    networks:
      - insta_net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
        IMAGE_VERSION: ${IMAGE_VERSION:-dev}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        VCS_REF: ${VCS_REF:-unknown}
    container_name: insta-manager-frontend
    restart: unless-stopped
    logging: *insta-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BIND_HOST:-0.0.0.0}:3000:3000"
    networks:
      - insta_net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Visualizador de logs sob demanda: `make docker-debug-up`
  log-viewer:
    image: amir20/dozzle:v8.12.4
    container_name: insta-manager-logs
    profiles: ["debug"]
    restart: unless-stopped
    logging: *insta-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - insta_net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

networks:
  insta_net:
    driver: bridge

volumes:
  insta_db_data:
    driver: local
