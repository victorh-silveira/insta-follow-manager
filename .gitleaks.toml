title = "Insta Follow Manager - Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Arquivos de exemplo, testes unitarios e dependencias locais ignoradas"
paths = [
  '''backend/\.env\.example$''',
  '''backend/\.venv/.*''',
  '''backend/tests/.*''',
  '''backend/src/infrastructure/gateways/mock_instagram_gateway\.py$''',
  '''frontend/node_modules/.*''',
  '''frontend/\.next/.*''',
]
